name: Build Jupiter (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cache bundled FFmpeg runtime
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/ffmpeg
          key: ffmpeg-win64-lgpl-9.0.2-gd7643a0fe3

      - name: Install frontend dependencies
        run: npm install

      - name: Install bundled FFmpeg runtime
        run: npm run setup:ffmpeg

      - name: Build standalone Windows executable
        run: npm run tauri build -- --no-bundle

      - name: Prepare FFmpeg runtime beside executable
        shell: pwsh
        run: |
          $runtimeTarget = "src-tauri/target/release/ffmpeg"
          New-Item -ItemType Directory -Path $runtimeTarget -Force | Out-Null
          Copy-Item -Path "src-tauri/resources/ffmpeg/*" -Destination $runtimeTarget -Recurse -Force

      - name: Upload standalone test build
        uses: actions/upload-artifact@v4
        with:
          name: Jupiter-Windows-Test-Build
          path: |
            src-tauri/target/release/jupiter.exe
            src-tauri/target/release/ffmpeg/**
          if-no-files-found: error
