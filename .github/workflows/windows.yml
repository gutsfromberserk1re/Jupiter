name: Windows Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Install bundled FFmpeg runtime
        run: npm run setup:ffmpeg

      - name: Test animation core
        run: npm test

      - name: Build standalone Windows executable
        run: npm run tauri build -- --no-bundle

      - name: Prepare FFmpeg runtime beside executable
        shell: pwsh
        run: |
          $runtimeTarget = "src-tauri/target/release/ffmpeg"
          New-Item -ItemType Directory -Path $runtimeTarget -Force | Out-Null
          Copy-Item -Path "src-tauri/resources/ffmpeg/*" -Destination $runtimeTarget -Recurse -Force

      - name: Upload standalone test build
        uses: actions/upload-artifact@v4
        with:
          name: Jupiter-Windows-Test-Build
          path: |
            src-tauri/target/release/jupiter.exe
            src-tauri/target/release/ffmpeg/**
          if-no-files-found: error
