<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7e8994" />
  <title>Untitled Project · Jupiter</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app-shell">
    <header class="titlebar glass-panel" id="titlebar">
      <div class="brand-zone">
        <button class="brand-orb" id="project-menu-button" title="Project menu" aria-label="Open project menu"><span>J</span></button>
        <div class="brand-copy" data-tauri-drag-region><strong>JUPITER</strong><span>2D ANIMATION STUDIO</span></div>
        <span class="title-divider"></span>
        <span class="project-name" id="project-name" data-tauri-drag-region>Untitled Project</span>
      </div>
      <div class="window-controls" aria-label="Window controls">
        <button class="window-dot maximize" id="window-maximize" title="Maximize / Restore" aria-label="Maximize or restore"></button>
        <button class="window-dot minimize" id="window-minimize" title="Minimize" aria-label="Minimize"></button>
        <button class="window-dot close" id="window-close" title="Close" aria-label="Close"></button>
      </div>
    </header>

    <div class="commandbar glass-panel">
      <div class="command-group">
        <button class="command-button square" id="undo-button" title="Undo · Ctrl+Z" aria-label="Undo" disabled>↶</button>
        <button class="command-button square" id="redo-button" title="Redo · Ctrl+Y" aria-label="Redo" disabled>↷</button>
      </div>
      <div class="command-spacer"></div>
      <button class="export-placeholder" id="export-placeholder" title="Export (coming later)" aria-label="Export">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/></svg>
      </button>
    </div>

    <main class="editor-layout">
      <aside class="tool-rail glass-panel" role="toolbar" aria-label="Editing tools">
        <button class="tool-button active" data-tool="select" title="Select (V)" aria-label="Select tool">
          <svg class="tool-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3L18 13L11 14L8 21Z"/><path d="M13 15L18 21"/></svg><span>Select</span><kbd>V</kbd>
        </button>
        <button class="tool-button" data-tool="move" title="Move artwork (M)" aria-label="Move artwork tool">
          <svg class="tool-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2V22M2 12H22M12 2L8.5 5.5M12 2L15.5 5.5M22 12L18.5 8.5M22 12L18.5 15.5M12 22L8.5 18.5M12 22L15.5 18.5M2 12L5.5 8.5M2 12L5.5 15.5"/></svg><span>Move</span><kbd>M</kbd>
        </button>
        <div class="tool-rail-divider"></div>
        <button class="tool-button" data-tool="rig" title="Rig (R)" aria-label="Rig tool">
          <svg class="tool-svg rig-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19L11.5 12L19 5"/><circle cx="5" cy="19" r="2.4"/><circle cx="11.5" cy="12" r="2.4"/><circle cx="19" cy="5" r="2.4"/><path d="M14.5 4.5L19.5 2.7L17.7 7.7"/></svg><span>Rig</span><kbd>R</kbd>
        </button>
        <button class="tool-button" data-tool="node" title="Node (N)" aria-label="Node tool">
          <svg class="tool-svg node-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2.8L17.2 12.6L11.1 13.5L8.6 20.7Z"/><path d="M12.4 14.8L18.6 21"/><circle cx="19" cy="21" r="1.6"/></svg><span>Node</span><kbd>N</kbd>
        </button>
        <div class="tool-rail-spacer"></div>
      </aside>

      <section class="stage-area" id="stage-area">
        <div class="stage-topline">
          <div class="stage-top-leading">
            <button class="icon-button panel-peek" id="toggle-tools" title="Collapse tools" aria-label="Collapse tools">‹</button>
            <div class="breadcrumb"><strong>CANVAS</strong><i>/</i><span id="stage-mode-label">SELECT</span></div>
          </div>
          <div class="stage-top-actions">
            <button class="icon-button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
            <span class="zoom-label" id="zoom-label">100%</span>
            <button class="icon-button" id="zoom-in" title="Zoom in" aria-label="Zoom in">＋</button>
            <button class="icon-button" id="toggle-inspector" title="Collapse inspector" aria-label="Collapse inspector">›</button>
          </div>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="stage-canvas" aria-label="Animation canvas"></canvas>
          <div class="stage-empty" id="stage-empty">
            <div class="empty-art-icon"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="6" width="36" height="36" rx="5"/><circle cx="17" cy="18" r="3"/><path d="M8 36L20 24L27 31L33 25L40 33"/></svg></div>
            <strong>Drop artwork</strong>
          </div>
          <span id="canvas-info" hidden>TRANSPARENT CANVAS</span>
        </div>
      </section>

      <aside class="inspector glass-panel" id="inspector-panel">
        <div class="inspector-tabs" role="tablist" aria-label="Inspector tabs">
          <button class="tab-button active" data-inspector-tab="values" role="tab" aria-selected="true">Values</button>
          <button class="tab-button" data-inspector-tab="media" role="tab" aria-selected="false">Media <span id="media-count" class="tab-count">0</span></button>
          <button class="icon-button subtle inspector-collapse" id="inspector-collapse" title="Collapse inspector" aria-label="Collapse inspector">›</button>
        </div>
        <div class="inspector-scroll">
          <div class="inspector-body" id="inspector-values"></div>
          <div class="inspector-body hidden" id="inspector-media">
            <div class="media-panel-heading"><div><span class="eyebrow">PROJECT LIBRARY</span><h2>Media</h2></div></div>
            <div class="media-filter"><span>Imported assets</span><span class="media-filter-note">DRAG TO TIMELINE</span></div>
            <div class="media-list" id="media-list"><div class="media-empty">No media</div></div>
          </div>
        </div>
      </aside>
    </main>

    <section class="bottom-dock" id="bottom-dock">
      <div class="timeline-toolbar">
        <div class="timeline-title"><strong>Timeline</strong><span class="fps-label" id="sequence-info">24 FPS · 00:00</span></div>
        <div class="transport">
          <button class="transport-button" id="go-start" title="Go to start">|◀</button>
          <button class="transport-button" id="step-back" title="Previous frame">◀</button>
          <button class="transport-button play" id="play-button" title="Play / Pause · Space">▶</button>
          <button class="transport-button" id="stop-button" title="Stop">■</button>
          <button class="transport-button" id="step-forward" title="Next frame">▶</button>
          <button class="transport-button" id="go-end" title="Go to end">▶|</button>
        </div>
        <div class="timeline-options"><label>FPS <select id="fps-select"><option>12</option><option selected>24</option><option>25</option><option>30</option><option>60</option></select></label><button class="icon-button" id="timeline-zoom-out" title="Zoom out">−</button><button class="icon-button" id="timeline-zoom-in" title="Zoom in">＋</button><button class="icon-button subtle" id="toggle-timeline" title="Collapse timeline">⌄</button></div>
      </div>
      <div class="timeline-body" id="timeline-body">
        <div class="timeline-label-column" id="timeline-labels"></div>
        <div class="timeline-scroll" id="timeline-scroll">
          <div class="timeline-content" id="timeline-content">
            <div class="timeline-ruler" id="timeline-ruler"></div>
            <div class="timeline-lanes" id="timeline-lanes"></div>
            <div class="playhead-line" id="playhead-line"><div class="playhead-cap"></div></div>
          </div>
        </div>
      </div>
      <div class="timeline-status"><span id="playhead-time">00:00:00:00</span><span id="timeline-hint"></span><span id="frame-label">F 0000</span></div>
    </section>
  </div>

  <div class="context-menu glass-panel hidden" id="project-menu">
    <div class="menu-brand"><span class="brand-orb small">J</span><div><strong>Jupiter</strong><small>2D Animation Studio</small></div></div>
    <button data-action="new-project"><span>New project</span><kbd>Ctrl+N</kbd></button>
    <button data-action="open-project"><span>Open project…</span><kbd>Ctrl+O</kbd></button>
    <button data-action="save-project"><span>Save project</span><kbd>Ctrl+S</kbd></button>
    <button data-action="save-as"><span>Save project as…</span></button>
    <div class="menu-separator"></div>
    <button data-action="import-png"><span>Import image…</span></button>
    <button data-action="import-audio"><span>Import audio…</span></button>
    <div class="menu-separator"></div>
    <button data-action="close-project"><span>Close project</span></button>
    <button data-action="exit"><span>Exit</span></button>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <input id="media-input" type="file" accept="image/*,audio/*" multiple hidden />
  <input id="png-input" type="file" accept="image/png,image/webp,image/jpeg" multiple hidden />
  <input id="audio-input" type="file" accept="audio/*" multiple hidden />
  <input id="project-input" type="file" accept=".jupiter,.json,application/json" hidden />
  <span id="tool-status" hidden></span><span id="sequence-name" hidden></span>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
