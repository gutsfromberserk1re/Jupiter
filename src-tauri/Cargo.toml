[package]
name = "jupiter"
version = "0.2.1"
description = "Jupiter 2D PNG rigging and animation studio"
authors = ["Jupiter"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mime_guess = "2"
